name: CI

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/national_hiking_test
      NODE_ENV: test
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: national_hiking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d national_hiking_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Canonical PostGIS integration replay
        run: npm run test:db

      - name: Production build
        run: npm run build
